public_health_analytics:
  target: dev

  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'health_user') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'health_analytics') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'public') }}"
      threads: 4